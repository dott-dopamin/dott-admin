async function submitRun(){
 if(!state.completed||!state.recordId||state.recordStatus==='saved')return;
 state.recordStatus='saving';save();render();
 const c=apiConfig();
 try{
 if(!c.supabaseUrl||!c.supabaseKey)throw Error('DB 연결 설정 없음');
 const res=await fetch(c.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/submit_dopamin_mystery_run',{
 method:'POST',headers:apiHeaders(),body:JSON.stringify({p_id:state.recordId,p_nickname:state.nickname,p_duration_seconds:state.durationSeconds,p_answers:state.answers})});
 const row=await res.json().catch(()=>null);
 if(!res.ok)throw Error(row?.message||'기록 등록 실패 ('+res.status+')');
 state.savedRecord=row;state.recordStatus='saved';save();
 }catch(err){state.recordStatus='local';state.recordError=String(err.message||err);save()}
 render();
}

function crossExam(p){
  const has=id=>state.opened.includes(id);
  if(p.id==='daeun')return has('call')?'영상통화 중 카메라를 잠깐 껐던 건 맞아요. 하지만 그게 제가 때렸다는 뜻은 아니잖아요!':'일정표 쓴 건 맞아요. 회장님하고 말다툼한 것도요. 근데 진짜 중요한 건 그 시간에 제가 어디 있었냐는 거죠.';
  if(p.id==='seungmin')return has('door')?'S-02 태그는 제가 쓴 게 맞아요. 20:57:49에 잠깐 나왔다가 20:58:42에 다시 들어간 것도요. 몰래 가져온 클라이밍 신발을 숨기려던 거예요.':'지문은 평소 카드함 정리하다 남았겠죠. 출입 기록을 먼저 확인해 주세요.';
  if(p.id==='jei')return (has('reconstruction')||has('layout'))?'사진에 나온 탈취제는 제가 책상 위에 둔 게 맞아요. 사실 휴대폰 때문에 잠깐 다시 들어온 적도 있어요. 하지만 정확한 시각은 제 진술만으로 확정할 수 없잖아요.':'그 탈취제 제 건 맞아요. 그게 왜 회장님 의자 밑에 있는지는 저도 모르겠어요.';
  if(p.id==='jihoon')return has('chatfull')?'제가 그걸 의자 아래서 봤을 수도 있죠. 그걸 왜 그렇게 캐물어요?':has('exit')?'편의점에 바로 갔다는 말이 좀 과장됐을 순 있어요. 하지만 때린 사람을 보신 건 아니잖아요.':has('corridor')?'그 복도 화면에서는 얼굴도 안 보이잖아요. 그게 저라는 증거가 있나요?':has('payment')?'앱으로 결제했어요. 그래도 그게 폭행 증거는 아니잖아요.':'편의점 영수증까지 냈는데 뭘 더 물어보시나요? 사건에 대해선 아는 거 없어요.';
  return p.extra;
}
