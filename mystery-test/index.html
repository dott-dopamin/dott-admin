function hero(){return `<section class="hero"><span class="stamp">DOPAMIN MYSTERY · CASE 001</span><h1>수요일의 일격 <span style="font-size:.55em">🔎</span></h1><div class="muted">주 6일 근무하는 도파민 회장 장한철. 유일한 휴일인 수요일 도트에 왔다가 20:58경 누군가에게 맞고 쓰러졌다!<br>허다은 · 손승민 · 박지훈 · 서제이. 네 사람 모두 한철에게 불만이 있고, 모두 한 가지씩 숨긴 일이 있다. 거짓말만으로 범인을 지목할 수는 없다.</div><div class="steps"><span class="pill ${state.stage===1?'on':''}">① 1차 현장 조사　${count(1)}/5</span><span class="pill ${state.stage===2?'on':''}">② 2차 추가 조사　${count(2)}/4</span><span class="pill">③ 용의자 심문　${state.interviewed.length}/4</span><span class="pill">④ 최종 추리</span></div></section>`}
function investigate(){const phase=state.stage,arr=data.filter(d=>d.stage===phase);return `<section class="paper"><div class="overview"><div><h2>${phase===1?'1차 현장 조사':'2차 추가 조사'}</h2><div class="muted">증거 후보 ${arr.length}개 중 <b>${limit(phase)}개만</b> 선택 열람할 수 있습니다. 이미 확인한 증거는 횟수 차감 없이 다시 열람 가능!</div></div><span class="count">🔎 남은 열람권 ${limit(phase)-count(phase)}회</span></div><div class="cards">${arr.map((c)=>{let opened=state.opened.includes(c.id),locked=!opened&&count(phase)>=limit(phase);return `<button type="button" class="card ${opened?'opened':''}" ${locked?'disabled':''} data-action="view" data-id="${c.id}"><img src="${c.img}" alt="${e(c.name)} 증거 사진" loading="lazy"><div class="copy"><h3>${e(c.name)}</h3><p>${e(c.teaser)}</p><div class="status">${opened?'✓ 열람 완료 · 다시 보기':locked?'열람 횟수 소진':'🔎 열람권 1회 사용'}</div></div></button>`}).join('')}</div>${phase===1?`<div class="notice">📌 1차 증거 ${count(1)}/5, 용의자 면담 ${state.interviewed.length}/4.<br>모두 마치면 2차 추가 조사가 열립니다. <button type="button" class="button primary" data-action="next" ${count(1)<5||state.interviewed.length<4?'disabled':''}>2차 추가 조사 열기</button></div>`:`<div class="notice">2차 열람 ${count(2)}/4 · 선택한 기록이 수사 수첩에 저장됩니다. <button type="button" class="button primary" data-action="final" ${count(2)<4?'disabled':''}>최종 추리 제출하기</button></div>`}</section>`}
function crossExam(p){
  const has=id=>state.opened.includes(id);
  if(p.id==='daeun')return has('call')?'영상통화 중 카메라를 잠깐 껐던 건 맞아요. 하지만 그게 제가 때렸다는 뜻은 아니잖아요!':'일정표 쓴 건 맞아요. 회장님하고 말다툼한 것도요. 근데 진짜 중요한 건 그 시간에 제가 어디 있었냐는 거죠.';
  if(p.id==='seungmin')return has('warehouse')?'창고에서 나왔다 들어간 거 맞아요! 클라이밍 신발 숨겼다가 들킬까봐 그랬어요. 누가 신발까지 증거로 쓰래요?':'지문은 평소 카드함 정리하다 남았겠죠. 구체적인 시간은 기록부터 보세요.';
  if(p.id==='jei')return (has('reconstruction')||has('layout'))?'아, 잠깐 다시 들어간 것도 맞아요. 휴대폰을 두고 나왔거든요. 탈취제는 책상에 두고 갔어요.':'그 탈취제 제 건 맞아요. 그게 왜 회장님 의자 밑에 있는지는 저도 모르겠어요.';
  if(p.id==='jihoon')return has('chatfull')?'제가 그걸 의자 아래서 봤을 수도 있죠. 그걸 왜 그렇게 캐물어요?':has('exit')?'편의점에 바로 갔다는 말이 좀 과장됐을 순 있어요. 하지만 때린 사람을 보신 건 아니잖아요.':has('payment')?'앱으로 결제했어요. 그래도 그게 폭행 증거는 아니잖아요.':'편의점 영수증까지 냈는데 뭘 더 물어보시나요? 사건에 대해선 아는 거 없어요.';
  return p.extra;
}
const characterPortraits = {"daeun":""+window.DOP_IMAGES[20]+"","seungmin":""+window.DOP_IMAGES[21]+"","jihoon":""+window.DOP_IMAGES[22]+"","jei":""+window.DOP_IMAGES[23]+""};
const interviewQuestions = [
  ['first','처음 진술을 들려주세요.'],
  ['motive','피해자와 갈등이 있었나요?'],
  ['alibi','사건 시간대에 어디에 있었나요?'],
  ['follow','초기 진술과 다른 기록이 있는데요?']
];
let activeQuestion='first';
function answerFor(p,q){
 if(q==='first')return p.voice;
 if(q==='motive')return p.motive;
 if(q==='alibi')return p.alibi;
 return crossExam(p);
}
function interview(){return `<section class="paper"><h2>💬 용의자 심문</h2><p class="muted">인물을 선택하면 캐릭터 프로필과 기존 사건 설정에 따른 실제 게임 진술을 확인합니다. 면담에는 증거 열람권이 필요하지 않습니다. 추가 진술은 확보한 증거에 따라 달라집니다.</p><div class="suspects">${people.map(p=>`<button type="button" class="suspect ${state.interviewed.includes(p.id)?'done':''} ${selectedPerson===p.id?'active':''}" data-action="person" data-id="${p.id}" aria-pressed="${selectedPerson===p.id}"><img class="portrait" src="${characterPortraits[p.id]}" alt="${e(p.name)} 캐릭터"><span class="suspect-copy"><b>${e(p.name)}</b><span>${e(p.tag)} · ${state.interviewed.includes(p.id)?'✓ 면담 완료':'면담하기'}</span></span></button>`).join('')}</div>${selectedPerson?(()=>{let p=people.find(x=>x.id===selectedPerson);let response=answerFor(p,activeQuestion);let extra=activeQuestion==='follow';return `<div class="dialog"><div><img class="profile-shot" src="${characterPortraits[p.id]}" alt="${e(p.name)} 캐릭터 확대"></div><div><h3>${e(p.name)} · 심문 기록</h3><div class="question-title">확인할 질문 선택</div>${interviewQuestions.map(([id,label])=>`<button type="button" class="qa-action" data-action="question" data-id="${id}" aria-pressed="${activeQuestion===id}">${activeQuestion===id?'●':'○'} ${e(label)}</button>`).join('')}<div class="answer-panel" aria-live="polite"><strong>${e(p.name)}의 답변</strong><p>${e(response)}</p>${extra?`<small>확인한 증거 범위에 따라 달라지는 추가 진술입니다. 진술과 물증을 구별해 판단하세요.</small>`:''}</div><p class="hint">※ 각 심문 발언은 허구의 게임 대사이며 본인 주장과 확인된 증거를 구별해야 합니다. 실제 인물과 관계없는 허구의 수사 게임입니다. 진술은 플레이어에게 공개할 수 있는 범위만 표시됩니다.</p></div></div>`})():''}</section>`}
function notebook(){let found=data.filter(x=>state.opened.includes(x.id));return `<section class="paper"><h2>📔 수사 수첩</h2><div class="muted">열람한 증거 ${found.length} / 20개 · 1차 ${count(1)} / 5 · 2차 ${count(2)} / 4</div><div class="notebook">${found.map(x=>`<div class="entry"><b>${x.stage}차 · ${e(x.name)}</b><p>${e(x.detail)}</p></div>`).join('')||'<p>아직 확보한 증거가 없습니다.</p>'}</div><h3 style="margin-top:23px">사건 기준 정보</h3><div class="muted">20:58 무렵 충격음이 들렸고, 21:07에 허다은이 쓰러진 회장을 발견했다. 네 사람은 모두 사건 시간대 전후 도트 안에 있었을 수 있으며 완전한 알리바이가 확보된 사람은 없다. 도트에 있던 인물은 회장과 네 명의 용의자뿐이었다. 정모실·회의실·창고·주출입구의 모든 기록 시각은 가상 사건 설정상 동일한 기준 시계로 맞춰져 있다.</div></section>`}
function final(){const found=data.filter(x=>state.opened.includes(x.id));return `<section class="paper"><h2>⚖️ 최종 추리</h2><p class="muted">네 사람 모두 숨긴 사실이 있습니다. 누가 단순히 거짓말했는지가 아니라, <b>누가 사건 현장 정황을 이용해 타인에게 의심을 돌렸는지</b> 추리하세요.</p><form id="verdict" class="form"><label>① 범인<select name="suspect" required><option value="">선택</option>${people.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></label><label>② 범행 동기<select name="motive" required><option value="">선택</option><option value="calendar">캘박 문제</option><option value="climbing">클라이밍 이야기</option><option value="late">23시 이후 벙 시작</option><option value="smoking">흡연 문제</option></select></label><label>③ 사용한 물건<select name="weapon" required><option value="">선택</option><option value="metal">금속 카드 보관함</option><option value="clock">탁상시계</option><option value="cup">머그컵</option><option value="book">두꺼운 룰북</option></select></label><label>④ 의도적으로 의심을 돌린 상대<select name="frame" required><option value="">선택</option><option value="daeun">허다은 · 일정표</option><option value="seungmin">손승민 · 지문</option><option value="jei">서제이 · 탈취제</option><option value="none">아무도 아님</option></select></label><label>⑤ 최종 판단에 도움이 된 증거<select name="proof" required><option value="">선택</option>${found.map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join('')}</select></label><div><button class="button primary" type="submit">사건의 진상 확인</button></div></form><div class="notice">열람권이 부족해도 답은 제출할 수 있어요. 다만 주요 기록을 확보하지 못했다면 완벽한 입증은 어려울 수 있습니다. 정답 점수와 별개로 증거 확보의 충분성도 표시합니다.</div></section>`}
function result(){let a=state.answers||{},s=Number(a.suspect==='jihoon')+Number(a.motive==='late')+Number(a.weapon==='metal')+Number(a.frame==='jei')+Number(['exit','chatfull'].includes(a.proof));const obtained=new Set(state.opened);const firm=obtained.has('exit')&&obtained.has('chatfull')&&(obtained.has('reconstruction')||obtained.has('group')||obtained.has('layout'));return `<section class="paper"><h2>🕵️ CASE CLOSED · ${s}/5 정답</h2><div class="notice"><b>증거 확보 평가:</b> ${firm?'핵심 흐름까지 교차 검증함':'일부 핵심 기록을 보지 못해 유죄 판단에는 추론의 여지가 남음'} · 실제 5+4 제한에서는 모든 것을 확인할 수 없으므로 진술 간의 모순도 중요합니다.</div><div class="ending"><strong>제작자 해설 · 가상의 진범 박지훈</strong><p>20:46, 장한철은 또 23:10 본게임 시작을 알렸다. 화가 난 지훈은 20:57 편의점 앱으로 간식을 미리 결제한 뒤 20:58경 정모실에서 회장과 다투다가 금속 카드 보관함으로 가격했다.</p><p>지훈은 보관함 손잡이에 이미 손승민 지문이 있는 점을 이용하고, 책상 위 서제이의 탈취제를 회장 의자 아래로 밀어 넣었다. 허다은 일정표는 다툼 뒤 회장에게 남아 있던 것으로, 별도 조작 증거는 없다. 사건 직후 지훈은 20:59:06 도트 밖으로 나갔고, 편의점에서 21:04 주문 물건을 수령했다.</p><p><strong>네 사람의 숨긴 행동</strong><br>📅 허다은은 회장과 소리 높여 다툰 사실과 통화 화면을 잠깐 껐던 일을 숨겼다.<br>🧗 손승민은 20:45 카드함을 옮기고 20:57:49~20:58:42 창고를 나왔던 사실을 감췄다. 이유는 몰래 가져온 클라이밍 신발이라고 한다.<br>🚭 서제이는 20:57:38~20:58:47 휴대폰을 가지러 잠깐 재입실한 일을 감췄다.<br>🌙 박지훈은 20:55부터 편의점에 있었다는 거짓 알리바이뿐 아니라, 사건이 발견되기 전인 21:00:10에 의자 아래 탈취제 위치를 먼저 언급했다.</p><p><strong>중요한 추리:</strong> 네 사람이 모두 거짓말을 했다는 것만으론 범인을 정할 수 없다. 20:58:12의 공격 시각, 박지훈의 출입구 퇴실 영상, 편의점 앱 결제, 그리고 발견 전 탈취제 위치를 알고 있던 메시지가 겹치면서 다른 용의자에게 의심을 돌린 정황이 강해진다. 특정 기록을 놓친 플레이어의 결론에는 의심이 남을 수 있다는 점도 의도된 게임 설계다.</p><p>의식을 되찾은 장한철: “...그래서 오늘 벙 몇 시에 시작해?”<br>도파민 일동: <strong>“회장님 제발 좀!!!!!!”</strong></p></div><button class="button" type="button" data-action="restart">다시 플레이하기</button></section>`}
function modalView(){const c=data.find(x=>x.id===modal);if(!c)return '';return `<div class="overlay" id="veil"><div class="modal" role="dialog" aria-modal="true" aria-label="증거 열람"><div class="modalhead"><h2>🔍 ${e(c.name)}</h2><button type="button" class="close" data-action="close" aria-label="닫기">×</button></div>${`<div class="modalphoto"><img src="${c.img}" alt="${e(c.name)} 증거 이미지"></div><a class="evidence-export" href="${c.img}" download="${e(c.id)}.png">↗ 증거 원본 이미지 저장</a>`}<div class="modaldesc"><b>조사 기록</b><div>${e(c.detail)}</div></div><p class="hint" style="margin:6px 0">※ 증거 사진은 사건 소품의 재현 이미지이며 실제 진술·시각은 조사 기록을 기준으로 합니다.</p><button class="button primary" type="button" data-action="close">수사 수첩에 보관하고 닫기</button></div></div>`}
function render(){const tabs=[['investigate','🔍 증거 조사'],['interview','💬 용의자 심문'],['notebook','📔 수사 수첩'],['final','⚖️ 최종 추리']];node.innerHTML=hero()+`<aside class="victim-bar" aria-label="피해자 정보"><img src=""+window.DOP_IMAGES[24]+"" alt="피해자 장한철 캐릭터"><div><span class="marker">VICTIM · 피해자</span><strong>장한철</strong><small>2026.11.04 (수) 20:58경 습격 · 21:07 발견<br>본게임 시작 예정 23:10 · 현재 사건 조사 중</small></div></aside>`+`<nav class="tabs">${tabs.map(([id,title])=>`<button class="tab ${view===id?'active':''}" data-action="tab" data-id="${id}">${title}</button>`).join('')}</nav>`+(state.completed?result():(view==='investigate'?investigate():view==='interview'?interview():view==='notebook'?notebook():final()))+`<p class="bottom">DOPAMIN MYSTERY · 2026.11.04 (수) · 테스트 페이지 · 본 사이트와 분리 · 실존 이름을 활용한 가상의 사건</p>`+(modal?modalView():'');}
node.addEventListener('click',evt=>{const btn=evt.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;
 if(action==='tab'){if(state.completed)return;if(id==='final'&&count(2)<4){view='final'}else{view=id}selectedPerson=null;activeQuestion='first';}
 else if(action==='view'){const c=data.find(x=>x.id===id);if(!c||c.stage!==state.stage)return;if(!state.opened.includes(id)){if(count(c.stage)>=limit(c.stage))return;state.opened.push(id);save()}modal=id;}
 else if(action==='close'){modal=null;}
 else if(action==='question'){if(!selectedPerson||!interviewQuestions.some(x=>x[0]===id))return;activeQuestion=id;if(id==='follow'&&!state.followups.includes(selectedPerson)){state.followups.push(selectedPerson);save()}}
 else if(action==='followup'){if(!people.some(p=>p.id===id)||!state.interviewed.includes(id))return;if(!state.followups.includes(id)){state.followups.push(id);save()}}
 else if(action==='person'){if(!people.some(p=>p.id===id))return;selectedPerson=id;activeQuestion='first';if(!state.interviewed.includes(id)){state.interviewed.push(id);save()}}
 else if(action==='next'){if(count(1)!==5||state.interviewed.length!==4)return;state.stage=2;view='investigate';save()}
 else if(action==='final'){if(state.stage!==2||count(2)!==4)return;view='final'}
 else if(action==='restart'){if(!window.confirm('수사 기록을 초기화하고 처음부터 시작할까요?'))return;state=blank();save();view='investigate';selectedPerson=null;modal=null}
 render();
});
node.addEventListener('submit',evt=>{if(evt.target.id!=='verdict')return;evt.preventDefault();if(count(2)!==4||state.stage!==2)return;const values=new FormData(evt.target);state.answers=Object.fromEntries(values.entries());state.completed=true;save();render()});
document.getElementById('reset').addEventListener('click',()=>{if(window.confirm('저장된 수사 기록을 모두 지울까요?')){state=blank();save();view='investigate';modal=null;selectedPerson=null;render()}});
render();
})();
</script><!-- v6: evidence 03,12,14,20 revised; using revised v5 evidence 06,07,08,11,16,18,19 -->
</body></html>
